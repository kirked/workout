<style>
:root {
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --muted: #8e8e93;
  --sep: rgba(60, 60, 67, .16);
  --fill: rgba(118, 118, 128, .12);
  --fill-strong: rgba(118, 118, 128, .2);
  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, .1);
  --weight: #007aff;
  --reps: #ff9500;
  --danger: #ff3b30;
  --set-dot: #3a3a3c;
  --bar-bg: rgba(242, 242, 247, .85);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --muted: #98989f;
    --sep: rgba(84, 84, 88, .55);
    --fill: rgba(118, 118, 128, .24);
    --fill-strong: rgba(118, 118, 128, .36);
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, .18);
    --weight: #0a84ff;
    --reps: #ff9f0a;
    --danger: #ff453a;
    --set-dot: #d1d1d6;
    --bar-bg: rgba(18, 18, 20, .82);
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.35;
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex; flex-direction: column;
}
/* App shell: top bar and tab bar stay put; only #scroller scrolls. */
#scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; }

.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.ico.sm { width: 18px; height: 18px; }
.ico.chev { width: 18px; height: 18px; color: var(--muted); opacity: .7; }

/* ---------- Top bar ---------- */
#topbar {
  flex: 0 0 auto; position: relative; z-index: 20;
  padding: env(safe-area-inset-top) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
  background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--sep);
}
.bar { height: 52px; display: flex; align-items: center; gap: 8px; max-width: 760px; margin: 0 auto; }
.bar .title { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 19px; border: 0; padding: 0;
  background: transparent; color: var(--accent);
}
.icon-btn:active { background: var(--fill); }
.icon-btn.on { background: var(--accent); color: #fff; }
.icon-btn.sm { width: 30px; height: 30px; border-radius: 15px; background: var(--fill); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.set-btns { display: flex; gap: 6px; flex: 0 0 auto; }
.unit-toggle {

/* ---------- Layout ---------- */

/* ---------- Buttons ---------- */

/* ---------- Home ---------- */
.hero {
  border-radius: 20px; padding: 22px 20px 16px; margin-bottom: 8px;

/* ---------- Lists ---------- */
.row {

}

.badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; margin-left: 4px; }

/* ---------- Workout ---------- */
.wo-sec { padding: 4px 0; }
.sec-title { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 4px 16px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); }
.ex { position: relative; overflow: hidden; border-top: .5px solid var(--sep); touch-action: pan-y; }

.sets {

}

/* ---------- Schedule ---------- */
.seg { display: flex; padding: 2px; border-radius: 10px; background: var(--fill); margin-bottom: 14px; }

.month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.mday {
  display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-height: 64px; min-width: 0;
  padding: 5px 4px; border: 0; border-radius: 10px; background: var(--card); box-shadow: var(--shadow); text-align: left;

/* ---------- History ---------- */

}

/* ---------- Sheets / modals ---------- */

.sheet-btn {
  display: block; width: 100%; min-height: 50px; border: 0; border-radius: 12px; margin-bottom: 8px;

}

    <div class="title" id="title">Workout</div>

    <button class="icon-btn" id="btn-export" data-act="export" aria-label="Export CSV" title="Export CSV"></button>
  </div>
</header>
<div id="scroller"><main id="main"></main></div>

<script>
'use strict';

/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const pdate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];

function fmtDate(s) {
  const d = pdate(s);
  let out = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '');
  if (d.getFullYear() !== new Date().getFullYear()) out += ' ' + d.getFullYear();
  return out;
}
function fmtDateLong(s) {
  const d = pdate(s);
  const o = { weekday: 'long', month: 'long', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-US', o);
}

/* =========================================================
   Storage — every record is its own localStorage key:
     wt.bp.<id>                 body part   {id,name,order,deleted?}
     wt.ex.<id>                 exercise    {id,bpId,name,sets,order,deleted?}
     wt.sch.<w|m><day>_<bpId>   schedule    {fmt,day,bpId}
     wt.set.<date>_<exId>_<n>   one set     {date,exId,bpId,set,reps,weight,unit,ts}
     wt.cfg.<key>               setting
   ========================================================= */
const PFX = 'wt.';
const Store = {
  bp: new Map(), ex: new Map(), sch: new Map(), set: new Map(), cfg: new Map(),
  load() {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(PFX)) continue;
      const rest = k.slice(PFX.length), dot = rest.indexOf('.');
      if (dot < 0) continue;
      const m = this[rest.slice(0, dot)];
      if (!(m instanceof Map)) continue;
      try { m.set(rest.slice(dot + 1), JSON.parse(localStorage.getItem(k))); } catch (e) { /* skip corrupt */ }
    }
  },
  put(type, id, val) {
    this[type].set(id, val);
    try { localStorage.setItem(`${PFX}${type}.${id}`, JSON.stringify(val)); }
    catch (e) { toast('Storage is full — could not save'); }
  },
  del(type, id) {
    this[type].delete(id);
    localStorage.removeItem(`${PFX}${type}.${id}`);
  },
  wipe() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PFX)) keys.push(k); }
    keys.forEach(k => localStorage.removeItem(k));
    ['bp', 'ex', 'sch', 'set', 'cfg'].forEach(t => this[t].clear());
  },
};

const defaultUnit = /^en-(US|LR)|^my/i.test(navigator.language || '') ? 'lb' : 'kg';
const cfg = (k, def) => (Store.cfg.has(k) ? Store.cfg.get(k) : def);
const setCfg = (k, v) => Store.put('cfg', k, v);
const unit = () => cfg('unit', defaultUnit);

/* =========================================================
   Weights & display format  (N@W, sets joined by ", ")
   ========================================================= */
const KG_PER_LB = 0.45359237;
const conv = (w, from, to) => (w == null || from === to ? w : from === 'lb' ? w * KG_PER_LB : w / KG_PER_LB);
const roundW = (w, u) => (u === 'kg' ? Math.round(w) : Math.round(w * 10) / 10);
const fmtW = (w, u) => (w == null || !isFinite(w) ? '' : String(roundW(w, u)));
const fmtSet = (r, u) => `${r.reps ?? '–'}@${r.weight == null ? '–' : fmtW(conv(r.weight, r.unit, u), u)}`;
const fmtSets = (recs, u) => recs.map(r => fmtSet(r, u)).join(', ');

/* =========================================================
   Queries
   ========================================================= */
const byOrder = (a, b) => (a.order - b.order) || a.name.localeCompare(b.name);
const bps = () => [...Store.bp.values()].filter(b => !b.deleted).sort(byOrder);
const exsOf = bpId => [...Store.ex.values()].filter(e => e.bpId === bpId && !e.deleted).sort(byOrder);
const names = list => list.map(b => esc(b.name)).join(' + ');
const nextOrder = list => (list.length ? Math.max(...list.map(x => x.order)) + 1 : 0);

/** exId -> Map(date -> [set records sorted by set #]) */
function setsIndex() {
  const idx = new Map();
  for (const r of Store.set.values()) {
    let m = idx.get(r.exId); if (!m) idx.set(r.exId, (m = new Map()));
    let a = m.get(r.date); if (!a) m.set(r.date, (a = []));
    a.push(r);
  }
  for (const m of idx.values()) for (const a of m.values()) a.sort((x, y) => x.set - y.set);
  return idx;
}

function scheduledFor(dateStr) {
  const d = pdate(dateStr), fmt = cfg('schedFmt', 'w');
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const ids = new Set();
  for (const s of Store.sch.values()) {
    if (s.fmt !== fmt) continue;
    if (fmt === 'w' && s.day === d.getDay()) ids.add(s.bpId);
    // Monthly: days that don't exist this month (29–31) fall on the last day.
    if (fmt === 'm' && (s.day === d.getDate() || (d.getDate() === lastDay && s.day > lastDay))) ids.add(s.bpId);
  }
  return bps().filter(b => ids.has(b.id));
}

function loggedBps(dateStr) {
  const ids = new Set();
  for (const r of Store.set.values()) if (r.date === dateStr) ids.add(r.bpId);
  return [...ids].map(id => Store.bp.get(id)).filter(Boolean).sort(byOrder);
}

/** Sets shown for an exercise on a date: the user's +/− adjustment for that day, else the default; never fewer than are logged. */
const setsKey = (date, exId) => `sets.${date}_${exId}`;
const setCount = (ex, date, maxN = 0) => Math.max(1, maxN, cfg(setsKey(date, ex.id), ex.sets || 1));

/** A day's workout is done when the user tapped Done, or every exercise of each logged body part has its default sets. */
function isDayDone(dateStr) {
  const logged = loggedBps(dateStr);
  if (!logged.length) return false;
  if (cfg(`done.${dateStr}`, false)) return true;
  const filled = new Map();
  for (const r of Store.set.values()) if (r.date === dateStr && r.reps != null) filled.set(r.exId, (filled.get(r.exId) || 0) + 1);
  return logged.every(b => exsOf(b.id).every(e => isSkipped(dateStr, e.id) || (filled.get(e.id) || 0) >= setCount(e, dateStr)));
}

function recentWorkouts(limit) {
  const byDate = new Map();
  for (const r of Store.set.values()) {
    let o = byDate.get(r.date); if (!o) byDate.set(r.date, (o = { date: r.date, bpIds: new Set(), count: 0 }));
    o.bpIds.add(r.bpId); o.count++;
  }
  return [...byDate.values()].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, limit);
}

/** Exercises removed from one day's workout (swipe → Delete); they stay assigned to the body part. */
const skipKey = (date, exId) => `skip.${date}_${exId}`;
const isSkipped = (date, exId) => cfg(skipKey(date, exId), false);

/** Active exercises for a body part, plus any deleted ones that have sets on this date. */
function woExercises(bpId, date, idx) {
  const list = exsOf(bpId);
  for (const e of Store.ex.values()) if (e.deleted && e.bpId === bpId && idx.get(e.id)?.has(date)) list.push(e);
  return list;
}

/* =========================================================
   Sheets, dialogs, toast
   ========================================================= */
const modalStack = [];
function sheet(title, bodyHTML, setup, kind = '') {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal ' + kind;
    wrap.innerHTML = `<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"></div>${title ? `<div class="sheet-title">${esc(title)}</div>` : ''}${bodyHTML}</div>`;
    $('#modal-root').appendChild(wrap);
    let done = false;
    const close = v => {
      if (done) return; done = true;
      modalStack.splice(modalStack.indexOf(close), 1);
      wrap.classList.remove('open');
      setTimeout(() => wrap.remove(), 260);
      resolve(v ?? null);
    };
    modalStack.push(close);
    wrap.querySelector('.backdrop').addEventListener('click', () => close(null));
    setup?.(wrap.querySelector('.sheet'), close);
    requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  });
}

function actions(title, items) {
  const body = items.map((it, i) => `<button class="sheet-btn${it.danger ? ' danger' : ''}" data-i="${i}">${esc(it.label)}</button>`).join('')
    + `<button class="sheet-btn cancel" data-i="-1">Cancel</button>`;
  return sheet(title, body, (s, close) => s.addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (b) close(+b.dataset.i < 0 ? null : items[+b.dataset.i].value);
  }));
}

const confirmSheet = (msg, ok = 'OK', danger = false) => actions(msg, [{ label: ok, value: true, danger }]).then(Boolean);

function formSheet(title, fields, submit = 'Save') {
  const body = `<form class="form" autocomplete="off" novalidate>
    ${fields.map(f => `<label class="field"><span>${esc(f.label)}</span>
      <input name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}"
        ${f.type ? '' : 'autocapitalize="words" autocorrect="off" spellcheck="false"'} ${f.attrs || ''}></label>`).join('')}
    <div class="form-actions"><button type="button" class="btn" data-cancel>Cancel</button><button type="submit" class="btn primary">${esc(submit)}</button></div>
  </form>`;
  return sheet(title, body, (s, close) => {
    const form = s.querySelector('form');
    const first = form.querySelector('input');
    first.focus();
    if (first.value) first.select();
    s.querySelector('[data-cancel]').addEventListener('click', () => close(null));
    form.addEventListener('submit', e => {
      e.preventDefault();
      const out = {};
      for (const f of fields) {
        const el = form.elements[f.name], v = el.value.trim();
        if (f.required && !v) { el.classList.add('invalid'); el.focus(); return; }
        out[f.name] = v;
      }
      close(out);
    });
  }, 'form');
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/** Same calendar day one month earlier (clamped to that month's last day). */
function monthAgo(d) {
  const last = new Date(d.getFullYear(), d.getMonth(), 0).getDate();
  return new Date(d.getFullYear(), d.getMonth() - 1, Math.min(d.getDate(), last));
}

Views.past = () => {
  const t = pdate(today()), from = monthAgo(t);
  const counts = new Map(recentWorkouts(Infinity).map(w => [w.date, w.count]));
  const monday = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7).getTime();
  const thisWeek = monday(t);
  let html = '', week = null;
  for (let d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1); d >= from; d.setDate(d.getDate() - 1)) {
    const ds = dstr(d), wk = monday(d);
    if (wk !== week) {
      if (week !== null) html += '</div>';
      const weeksAgo = Math.round((thisWeek - wk) / (7 * 864e5));
      const label = weeksAgo === 0 ? 'This week' : weeksAgo === 1 ? 'Last week' : `Week of ${fmtDate(dstr(new Date(wk))).replace(/^\w+ /, '')}`;
      html += `<h3 class="section-h">${esc(label)}</h3><div class="card list">`;
      week = wk;
    }
    const logged = loggedBps(ds), sched = scheduledFor(ds), n = counts.get(ds) || 0;
    const sub = logged.length ? `${names(logged)} · ${n} set${n === 1 ? '' : 's'}`
      : sched.length ? `Scheduled: ${names(sched)}` : 'Nothing scheduled';
    const status = !logged.length ? '' : isDayDone(ds) ? `<span class="chip ok">${ICON.check}Done</span>` : '<span class="chip rest">Partial</span>';
    html += `<button class="row" data-act="past-day" data-date="${ds}"><div class="row-main">
      <div class="row-title">${esc(fmtDate(ds))}</div><div class="row-sub">${sub}</div></div>${status}${ICON.chev}</button>`;
  }
  if (week !== null) html += '</div>';
  return `<div class="page-head"><div class="kicker">Log a past workout</div><h1>Choose a day</h1>
    <div class="legend">Days with nothing logged let you pick a body part.</div></div>${html}`;
};

function exBlock(ex, date, idx, u) {
  const byDate = idx.get(ex.id) || new Map();
  const cur = byDate.get(date) || [];
  let lastDate = null;
  for (const d of byDate.keys()) if (d < date && (!lastDate || d > lastDate)) lastDate = d;
  const last = lastDate ? byDate.get(lastDate) : null;
  const maxN = cur.reduce((m, r) => Math.max(m, r.set), 0);
  const count = setCount(ex, date, maxN);
  let cells = '';
  for (let n = 1; n <= count; n++) {
    const r = cur.find(x => x.set === n), p = last?.[n - 1];
    const rv = r?.reps ?? '';
    const wv = r && r.weight != null ? (r.unit === u ? r.weight : roundW(conv(r.weight, r.unit, u), u)) : '';
    const rp = p?.reps ?? 'reps';
    const wp = p && p.weight != null ? fmtW(conv(p.weight, p.unit, u), u) : u;
    const lbl = `${esc(ex.name)} set ${n}`;
    cells += `<div class="set${r ? ' filled' : ''}">
      <input class="reps" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" enterkeyhint="next" aria-label="${lbl} reps"
        data-ex="${ex.id}" data-n="${n}" data-f="reps" value="${rv}" placeholder="${esc(rp)}"><span class="at">@</span><input
        class="wt" type="text" inputmode="decimal" maxlength="6" enterkeyhint="next" aria-label="${lbl} weight"
        data-ex="${ex.id}" data-n="${n}" data-f="w" value="${wv}" placeholder="${esc(wp)}"></div>`;
  }
  const lastTxt = last
    ? `<button type="button" class="last" data-act="hist" data-ex="${ex.id}" title="View history">${esc(fmtDate(lastDate))}: ${esc(fmtSets(last, u))}</button>`
    : `<span class="last none">first time</span>`;
  return `<div class="ex">
    <button class="ex-del" data-act="ex-skip" data-ex="${ex.id}" tabindex="-1">Delete</button>
    <div class="ex-main"><div class="ex-head"><div class="ex-title"><b>${esc(ex.name)}</b> <span class="dash">–</span> ${lastTxt}</div>
      <div class="set-btns">
        <button class="icon-btn sm" data-act="rm-set" data-ex="${ex.id}" data-count="${count}" aria-label="Remove last set" title="Remove last set"${count <= 1 ? ' disabled' : ''}>${ICON.minus}</button>
        <button class="icon-btn sm" data-act="add-set" data-ex="${ex.id}" data-count="${count}" aria-label="Add a set" title="Add a set">${ICON.plus}</button></div></div>
    <div class="sets">${cells}</div></div></div>`;
}

Views.history = v => {
  const groups = bps().map(b => ({ b, exs: exsOf(b.id) })).filter(g => g.exs.length);
  if (!groups.length) return '<div class="empty">No exercises defined yet.</div>';
  const idx = setsIndex(), u = unit();
  const active = groups.flatMap(g => g.exs);
  let exId = v.exId || cfg('histEx');
  if (!active.some(e => e.id === exId)) exId = (active.find(e => idx.has(e.id)) || active[0]).id;
  v.exId = exId;
  const byDate = idx.get(exId) || new Map();
  const dates = [...byDate.keys()].sort();
  let best = null;
  for (const recs of byDate.values()) for (const r of recs) {
    if (r.weight == null) continue;
    const w = conv(r.weight, r.unit, u);
    if (!best || w > best.w || (w === best.w && (r.reps || 0) > (best.r.reps || 0))) best = { w, r };
  }
  return `<label class="select-wrap"><select id="hist-ex" aria-label="Exercise">${groups.map(g =>
      `<optgroup label="${esc(g.b.name)}">${g.exs.map(e => `<option value="${e.id}"${e.id === exId ? ' selected' : ''}>${esc(e.name)}</option>`).join('')}</optgroup>`).join('')}
    </select>${ICON.chev}</label>
    <section class="card chart-card">
      <div class="chart-info" id="chart-info"></div>
      <div id="chart"></div>
      <div class="chart-legend"><span><i class="w"></i>Top weight (${u}) · right</span><span><i class="r"></i>Avg reps · left</span><span>dots = individual sets</span></div>
    </section>
    <div class="stats">
      <div class="stat"><div class="stat-v">${dates.length}</div><div class="stat-l">sessions</div></div>
      <div class="stat"><div class="stat-v">${best ? esc(fmtSet(best.r, u)) : '–'}</div><div class="stat-l">heaviest set</div></div>
      <div class="stat"><div class="stat-v">${dates.length ? esc(fmtDate(dates[dates.length - 1]).replace(/^\w+ /, '')) : '–'}</div><div class="stat-l">last done</div></div>
    </div>
    <h3 class="section-h">Sessions</h3>
    <div class="card list">${dates.length ? dates.slice().reverse().map(d =>
      `<div class="hrow"><span class="hdate">${esc(fmtDate(d))}</span><span class="hsets">${esc(fmtSets(byDate.get(d), u))}</span></div>`).join('')
      : '<div class="empty-sm">No sets logged for this exercise yet.</div>'}</div>`;
};

/* =========================================================
   Chart (SVG)
   ========================================================= */
function niceStep(raw, int) {
  if (!(raw > 0)) raw = 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const steps = int && p < 10 ? [1, 2, 5, 10] : [1, 2, 2.5, 5, 10];
  const s = steps.find(x => f <= x + 1e-9) * p;
  return int ? Math.max(1, Math.round(s)) : s;
}
function niceScale(min, max, n, int) {
  if (max - min < 1e-9) { const d = int ? 2 : Math.max(5, min * 0.1); min -= d; max += d; }
  const padV = (max - min) * 0.06; min -= padV; max += padV;
  if (min < 0) min = 0;
  let step = niceStep((max - min) / n, int), lo = 0;
  for (let i = 0; i < 12; i++) {
    lo = Math.floor(min / step) * step;
    if (lo + step * n >= max - 1e-9) break;
    step = niceStep(step * 1.0001, int);
  }
  return { lo, step };
}
const num = v => String(+v.toFixed(1));

function drawHistoryChart(exId) {
  const el = $('#chart'), info = $('#chart-info');
  if (!el) return;
  const u = unit();
  const byDate = setsIndex().get(exId) || new Map();
  const sessions = [...byDate.keys()].sort().map(date => {
    const recs = byDate.get(date);
    return { date, recs, sets: recs.map(r => ({ reps: r.reps, w: r.weight == null ? null : conv(r.weight, r.unit, u) })) };
  });
  if (!sessions.length) {
    el.innerHTML = '<div class="chart-empty">Log this exercise in a workout to see progress here.</div>';
    info.textContent = '';
    return;
  }
  const W = Math.max(260, Math.floor(el.clientWidth)), H = Math.round(Math.max(210, Math.min(320, W * 0.6)));
  const m = { l: 34, r: 44, t: 20, b: 26 }, iw = W - m.l - m.r, ih = H - m.t - m.b, N = 4;
  const days = sessions.map(s => Math.round(pdate(s.date).getTime() / 864e5));
  let t0 = Math.min(...days), t1 = Math.max(...days);
  if (t1 - t0 < 1) { t0 -= 1; t1 += 1; }
  const X = d => m.l + (d - t0) / (t1 - t0) * iw;
  const allW = [], allR = [];
  sessions.forEach(s => s.sets.forEach(x => { if (x.w != null) allW.push(x.w); if (x.reps != null) allR.push(x.reps); }));
  const sw = allW.length ? niceScale(Math.min(...allW), Math.max(...allW), N, false) : { lo: 0, step: 25 };
  const sr = allR.length ? niceScale(Math.min(...allR), Math.max(...allR), N, true) : { lo: 0, step: 5 };
  const YW = w => m.t + ih * (1 - (w - sw.lo) / (sw.step * N));
  const YR = r => m.t + ih * (1 - (r - sr.lo) / (sr.step * N));

  let g = '';
  for (let i = 0; i <= N; i++) {
    const y = (m.t + ih * (1 - i / N)).toFixed(1);
    g += `<line class="grid" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"/>`;
    g += `<text class="ax-r" x="${m.l - 6}" y="${+y + 4}" text-anchor="end">${num(sr.lo + i * sr.step)}</text>`;
    g += `<text class="ax-w" x="${m.l + iw + 6}" y="${+y + 4}">${num(sw.lo + i * sw.step)}</text>`;
  }
  g += `<text class="ax-r ttl" x="${m.l - 6}" y="${m.t - 8}" text-anchor="end">reps</text>`;
  g += `<text class="ax-w ttl" x="${m.l + iw + 6}" y="${m.t - 8}">${u}</text>`;

  // x-axis labels
  const span = t1 - t0, n = sessions.length, minGap = 58;
  const maxL = Math.max(2, Math.floor(iw / minGap));
  const cand = n <= maxL ? [...Array(n).keys()] : [...Array(maxL).keys()].map(k => Math.round(k * (n - 1) / (maxL - 1)));
  let lastX = -1e9;
  for (const i of new Set(cand)) {
    const x = X(days[i]);
    if (x - lastX < minGap) continue;
    lastX = x;
    const dt = pdate(sessions[i].date);
    const lbl = span > 330 ? dt.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }) : dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const anchor = x - m.l < 22 ? 'start' : (m.l + iw - x < 22 ? 'end' : 'middle');
    g += `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${lbl}</text>`;
  }

  // individual set dots
  sessions.forEach((s, i) => {
    const x = X(days[i]).toFixed(1);
    s.sets.forEach(p => {
      if (p.w != null) g += `<circle class="dot-w" cx="${x}" cy="${YW(p.w).toFixed(1)}" r="3"/>`;
      if (p.reps != null) g += `<circle class="dot-r" cx="${x}" cy="${YR(p.reps).toFixed(1)}" r="3"/>`;
    });
  });

  // per-session lines: top weight & average reps
  const ptsW = [], ptsR = [];
  sessions.forEach((s, i) => {
    const ws = s.sets.map(p => p.w).filter(v => v != null);
    const rs = s.sets.map(p => p.reps).filter(v => v != null);
    if (ws.length) ptsW.push([X(days[i]), YW(Math.max(...ws))]);
    if (rs.length) ptsR.push([X(days[i]), YR(rs.reduce((a, b) => a + b, 0) / rs.length)]);
  });
  const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
  if (ptsR.length > 1) g += `<path class="line-r" d="${path(ptsR)}"/>`;
  if (ptsW.length > 1) g += `<path class="line-w" d="${path(ptsW)}"/>`;
  ptsR.forEach(p => { g += `<circle class="pt-r" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/>`; });
  ptsW.forEach(p => { g += `<circle class="pt-w" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5"/>`; });
  g += `<line class="hl" id="chart-hl" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}"/>`;

  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Progress chart">${g}</svg>`;

  const svg = el.querySelector('svg'), hl = $('#chart-hl');
  const xs = days.map(X);
  const show = i => {
    hl.setAttribute('x1', xs[i]); hl.setAttribute('x2', xs[i]);
    info.innerHTML = `<b>${esc(fmtDate(sessions[i].date))}</b>: ${esc(fmtSets(sessions[i].recs, u))}`;
  };
  const pick = e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    let best = 0;
    xs.forEach((v, i) => { if (Math.abs(v - x) < Math.abs(xs[best] - x)) best = i; });
    show(best);
  };
  svg.addEventListener('pointerdown', pick);
  svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) pick(e); });
  show(sessions.length - 1);
}

function renderChrome() {

  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === tabOf(view.name)));
}

function render() {
  swipeOpen = null;
  renderChrome();
  $('#main').innerHTML = (Views[view.name] || Views.home)(view);
  Mount[view.name]?.(view);
}

function go(v, { keepScroll = false } = {}) {
  const { scrollY, ...clean } = v;
  view = clean;
  try { sessionStorage.setItem('wt.view', JSON.stringify(view)); } catch (e) { /* ignore */ }
  render();
  if (!keepScroll) $('#scroller').scrollTop = scrollY || 0;
}

function startWorkout() {
  const t = today();
  const sched = scheduledFor(t).map(b => b.id), logged = loggedBps(t).map(b => b.id);
  let ids = logged;
  if (!logged.length) ids = sched;
  else if (logged.some(id => sched.includes(id))) ids = [...new Set([...sched, ...logged])];
  if (!ids.length) return go({ name: 'pick', date: t });
  ids = ids.map(id => Store.bp.get(id)).sort(byOrder).map(b => b.id);
  go({ name: 'workout', date: t, bpIds: ids });
}

function moveItem(list, id, dir, type) {
  list.forEach((x, i) => { x.order = i; });
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list[i].order = j; list[j].order = i;
  list.forEach(x => Store.put(type, x.id, x));
}

const hasSets = exId => [...Store.set.values()].some(r => r.exId === exId);
function removeExercise(ex) {
  if (hasSets(ex.id)) { ex.deleted = true; Store.put('ex', ex.id, ex); }   // keep history for charts/export
  else Store.del('ex', ex.id);
}
function removeBodyPart(bp) {
  const all = [...Store.ex.values()].filter(e => e.bpId === bp.id);
  all.filter(e => !e.deleted).forEach(removeExercise);
  for (const [k, s] of [...Store.sch]) if (s.bpId === bp.id) Store.del('sch', k);
  if (all.some(e => hasSets(e.id))) { bp.deleted = true; Store.put('bp', bp.id, bp); }
  else Store.del('bp', bp.id);
}
const clampSets = v => Math.min(12, Math.max(1, parseInt(v, 10) || 4));

async function editExercise(ex) {

    { name: 'sets', label: 'Default sets', type: 'number', value: ex.sets, attrs: 'inputmode="numeric" min="1" max="12"' },

function schedDaySheet(fmt, day) {

  const rows = () => list.map(b => {

  }).join('');

/* =========================================================
   CSV export
   ========================================================= */
function csvCell(v) {
  if (v == null) return '';
  const s = String(v);
  return /[",\r\n]|^\s|\s$/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function buildCSV(u) {
  const idx = setsIndex();
  const rank = bp => (bp ? (bp.deleted ? 1e6 : 0) + bp.order : 2e6);
  const exs = [...Store.ex.values()].filter(e => !e.deleted || idx.has(e.id)).sort((a, b) => {
    const A = Store.bp.get(a.bpId), B = Store.bp.get(b.bpId);
    return (rank(A) - rank(B)) || (A?.name || '').localeCompare(B?.name || '') || ((a.deleted ? 1 : 0) - (b.deleted ? 1 : 0)) || (a.order - b.order);
  });
  let maxSess = 0, maxSets = 0;
  const data = exs.map(ex => {
    const m = idx.get(ex.id) || new Map();
    const dates = [...m.keys()].sort();
    maxSess = Math.max(maxSess, dates.length);
    dates.forEach(d => { maxSets = Math.max(maxSets, m.get(d).length); });
    return { ex, bp: Store.bp.get(ex.bpId), dates, m };
  });
  const header = ['Exercise', 'Body Part'];
  for (let s = 1; s <= maxSess; s++) {
    header.push(`#${s} Date`, `#${s} Set Count`);
    for (let k = 1; k <= maxSets; k++) header.push(`#${s} Set ${k} Reps`, `#${s} Set ${k} Weight (${u})`);
  }
  const rows = data.map(({ ex, bp, dates, m }) => {
    const row = [ex.name, bp?.name ?? ''];
    dates.forEach(d => {
      const recs = m.get(d);
      row.push(d, recs.length);
      for (let k = 0; k < maxSets; k++) {
        const r = recs[k];
        row.push(r?.reps ?? '', r && r.weight != null ? (r.unit === u ? r.weight : roundW(conv(r.weight, r.unit, u), u)) : '');
      }
    });
    while (row.length < header.length) row.push('');
    return row;
  });
  return [header, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

function downloadCSV(u) {
  const name = `workout-${today()}-${u}.csv`;
  const text = '\uFEFF' + buildCSV(u);
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  // Home-screen web apps on iOS can't use <a download>; use the share sheet there.
  if (navigator.standalone && typeof File === 'function') {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare?.({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => {}); return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function exportFlow() {
  let u = unit();
  const nSets = Store.set.size, nEx = new Set([...Store.set.values()].map(r => r.exId)).size;
  const body = `<p class="sheet-note">${nSets} set${nSets === 1 ? '' : 's'} logged across ${nEx} exercise${nEx === 1 ? '' : 's'}.<br>Choose the weight unit for the file:</p>
    <div class="seg"><button type="button" data-u="lb">Pounds (lb)</button><button type="button" data-u="kg">Kilograms (kg)</button></div>
    <div class="form-actions"><button class="btn" data-cancel>Cancel</button><button class="btn primary" data-go>${ICON.dl} Download CSV</button></div>`;
  sheet('Export data', body, (s, close) => {
    const upd = () => $$('[data-u]', s).forEach(b => b.classList.toggle('on', b.dataset.u === u));
    upd();
    s.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.u) { u = b.dataset.u; upd(); }
      else if ('cancel' in b.dataset) close();
      else if ('go' in b.dataset) { downloadCSV(u); close(); }
    });
  });
}

/* =========================================================

const A = {
  tab: el => go({ name: el.dataset.v }),
  unit: () => { setCfg('unit', unit() === 'lb' ? 'kg' : 'lb'); render(); },
  export: () => exportFlow(),
  'hist-toggle': () => {
    if (view.name === 'history') { const back = histReturn || { name: 'home' }; histReturn = null; go(back); }
    else { histReturn = { ...view, scrollY: $('#scroller').scrollTop }; go({ name: 'history' }); }
  },
  hist: el => {
    if (view.name !== 'history') histReturn = { ...view, scrollY: $('#scroller').scrollTop };

    go({ name: 'history', exId: el.dataset.ex });
  },
  start: () => startWorkout(),
  pick: () => go({ name: 'pick', date: today() }),
  'pick-bp': el => go({ name: 'workout', date: view.date || today(), bpIds: [el.dataset.bp], from: view.from }),
  'pick-sched': () => go({ name: 'workout', date: view.date, bpIds: scheduledFor(view.date).map(b => b.id), from: view.from }),
  past: () => go({ name: 'past' }),
  'past-day': el => {
    const date = el.dataset.date, logged = loggedBps(date).map(b => b.id);
    go(logged.length ? { name: 'workout', date, bpIds: logged, from: 'past' } : { name: 'pick', date, from: 'past' });
  },
  'open-wo': el => go({ name: 'workout', date: el.dataset.date, bpIds: el.dataset.bps.split(',').filter(id => Store.bp.has(id)) }),
  'ex-skip': async el => {
    const ex = el.dataset.ex, date = view.date, name = Store.ex.get(ex)?.name;
    const recs = [...Store.set.keys()].filter(k => k.startsWith(`${date}_${ex}_`));
    if (recs.length && !(await confirmSheet(`Remove ${name} from this workout? ${recs.length} logged set${recs.length === 1 ? '' : 's'} will be deleted.`, 'Remove', true))) return closeSwipe();
    recs.forEach(k => Store.del('set', k));
    setCfg(skipKey(date, ex), true);
    render();
  },
  'ex-unskip': el => { Store.del('cfg', skipKey(view.date, el.dataset.ex)); render(); },
  'add-set': el => {
    const ex = el.dataset.ex, n = +el.dataset.count + 1;
    setCfg(setsKey(view.date, ex), n);

    $(`.set input.reps[data-ex="${ex}"][data-n="${n}"]`)?.focus();

    const ex = el.dataset.ex, n = +el.dataset.count, date = view.date;
    if (n <= 1) return;
    const key = `${date}_${ex}_${n}`, rec = Store.set.get(key);
    if (rec && !(await confirmSheet(`Remove set ${n} (${fmtSet(rec, unit())})? Its logged entry will be deleted.`, 'Remove', true))) return;
    if (rec) Store.del('set', key);
    setCfg(setsKey(date, ex), n - 1);
    render();
  },
  'wo-add-bp': async () => {
    const avail = bps().filter(b => !view.bpIds.includes(b.id));
    if (!avail.length) return toast('All body parts are already in this workout');
    const id = await actions('Add a body part', avail.map(b => ({ label: b.name, value: b.id })));
    if (!id) return;
    view.bpIds.push(id);
    go(view, { keepScroll: true });
    $(`[data-bpsec="${id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  'wo-rm-bp': async el => {
    const id = el.dataset.bp, bp = Store.bp.get(id);
    const recs = [...Store.set.entries()].filter(([, r]) => r.date === view.date && r.bpId === id);
    if (recs.length && !(await confirmSheet(`Remove ${bp.name} from this workout? ${recs.length} logged set${recs.length === 1 ? '' : 's'} will be deleted.`, 'Remove', true))) return;
    recs.forEach(([k]) => Store.del('set', k));
    view.bpIds = view.bpIds.filter(x => x !== id);
    view.bpIds.length ? go(view, { keepScroll: true }) : go({ name: 'home' });
  },
  done: () => {
    const n = [...Store.set.values()].filter(r => r.date === view.date && view.bpIds.includes(r.bpId)).length;
    if (n) setCfg(`done.${view.date}`, true);
    toast(n ? `Workout saved · ${n} set${n === 1 ? '' : 's'}` : 'No sets logged');

  },
  sample: () => { loadSample(); go({ name: 'exercises' }); },
  'bp-add': async () => {
    const r = await formSheet('New body part', [{ name: 'name', label: 'Name', placeholder: 'e.g. Chest', required: true }], 'Add');
    if (!r) return;
    const id = uid();
    Store.put('bp', id, { id, name: r.name, order: nextOrder(bps()) });
    render();
  },
  'bp-menu': async el => {
    const bp = Store.bp.get(el.dataset.bp);
    const a = await actions(bp.name, [
      { label: 'Rename', value: 'rn' }, { label: 'Move up', value: 'up' }, { label: 'Move down', value: 'dn' },
      { label: 'Delete body part', value: 'del', danger: true },
    ]);
    if (a === 'rn') {
      const r = await formSheet('Rename body part', [{ name: 'name', label: 'Name', value: bp.name, required: true }]);
      if (r) { bp.name = r.name; Store.put('bp', bp.id, bp); }
    } else if (a === 'up' || a === 'dn') moveItem(bps(), bp.id, a === 'up' ? -1 : 1, 'bp');
    else if (a === 'del' && await confirmSheet(`Delete “${bp.name}” and its exercises? Logged history is kept and still exported.`, 'Delete', true)) removeBodyPart(bp);
    render();
  },
  'ex-add': async el => {
    const bpId = el.dataset.bp, bp = Store.bp.get(bpId);
    const r = await formSheet(`New ${bp.name} exercise`, [
      { name: 'name', label: 'Exercise name', placeholder: 'e.g. Flat Press', required: true },
      { name: 'sets', label: 'Default sets', type: 'number', value: 4, attrs: 'inputmode="numeric" min="1" max="12"' },
    ], 'Add');
    if (!r) return;
    const id = uid();
    Store.put('ex', id, { id, bpId, name: r.name, sets: clampSets(r.sets), order: nextOrder(exsOf(bpId)) });
    render();
  },
  'ex-edit': el => editExercise(Store.ex.get(el.dataset.ex)),
  'ex-sets': el => {
    const ex = Store.ex.get(el.dataset.ex);
    ex.sets = Math.min(12, Math.max(1, ex.sets + +el.dataset.d));
    Store.put('ex', ex.id, ex);
    render();
  },
  'ex-menu': async el => {
    const ex = Store.ex.get(el.dataset.ex);
    const a = await actions(ex.name, [
      { label: 'Edit', value: 'ed' }, { label: 'Move up', value: 'up' }, { label: 'Move down', value: 'dn' },
      { label: 'Delete exercise', value: 'del', danger: true },
    ]);
    if (a === 'ed') return editExercise(ex);
    if (a === 'up' || a === 'dn') moveItem(exsOf(ex.bpId), ex.id, a === 'up' ? -1 : 1, 'ex');
    else if (a === 'del' && await confirmSheet(`Delete “${ex.name}”? Logged history is kept and still exported.`, 'Delete', true)) removeExercise(ex);
    render();
  },
  'sched-fmt': el => { setCfg('schedFmt', el.dataset.f); render(); },
  'sched-day': el => schedDaySheet(cfg('schedFmt', 'w'), +el.dataset.day),
  wipe: async () => {
    if (!(await confirmSheet('Erase ALL body parts, exercises, schedule and workout history from this device? Consider exporting first.', 'Erase everything', true))) return;
    Store.wipe();
    toast('All data erased');
    go({ name: 'home' });
  },
};

/* =========================================================
   Set entry — each set saves to its own record immediately
   ========================================================= */
function saveSetInput(inp) {
  inp.value = inp.dataset.f === 'reps' ? inp.value.replace(/\D/g, '') : inp.value.replace(/[^\d.,]/g, '');
  const cell = inp.closest('.set'), exId = inp.dataset.ex, n = +inp.dataset.n, date = view.date;
  const key = `${date}_${exId}_${n}`, old = Store.set.get(key);
  const rv = $('.reps', cell).value.trim(), wv = $('.wt', cell).value.trim().replace(',', '.');
  let reps = rv === '' ? null : parseInt(rv, 10);
  let wNum = wv === '' ? null : parseFloat(wv);
  if (!Number.isFinite(reps)) reps = null;
  if (!Number.isFinite(wNum)) wNum = null;
  if (reps == null && wNum == null) {
    if (old) Store.del('set', key);
    cell.classList.remove('filled');
    return;
  }
  // Keep the originally-entered weight & unit unless the weight itself was edited (lossless unit toggling).
  let weight = wNum, u = unit();
  if (inp.dataset.f !== 'w' && old && old.weight != null && wNum != null) { weight = old.weight; u = old.unit; }
  const ex = Store.ex.get(exId);
  Store.put('set', key, { date, exId, bpId: ex.bpId, set: n, reps, weight, unit: u, ts: Date.now() });
  cell.classList.add('filled');
}

/* =========================================================
   Swipe an exercise left to reveal Delete
   ========================================================= */
const SWIPE_W = 88;
let swipeOpen = null;                  // the .ex row whose Delete button is showing

function slide(row, x) { $('.ex-main', row).style.transform = x ? `translateX(${x}px)` : ''; }
function closeSwipe() {
  const row = swipeOpen;
  if (!row) return;
  swipeOpen = null;
  slide(row, 0);
  // Keep the tap shield until the slide finishes, so the closing tap can't also focus a field.
  setTimeout(() => { if (swipeOpen !== row) row.classList.remove('open'); }, 300);
}

function initSwipe(main) {
  let drag = null;                     // { row, id, x0, y0, base, dx, horiz }
  // Any touch outside the open row's Delete button closes it (a touch on the row itself may also drag it shut).
  document.addEventListener('pointerdown', e => {
    if (swipeOpen && !e.target.closest('.ex-del') && e.target.closest('.ex') !== swipeOpen) closeSwipe();
  }, true);
  main.addEventListener('pointerdown', e => {
    const row = e.target.closest('.ex');
    if (!row || e.target.closest('.ex-del') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { row, id: e.pointerId, x0: e.clientX, y0: e.clientY, base: row === swipeOpen ? -SWIPE_W : 0, dx: 0, horiz: null };
  });
  main.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (drag.horiz === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      drag.horiz = Math.abs(dx) > Math.abs(dy);
      if (!drag.horiz) { drag = null; return; }   // vertical: let the page scroll
      drag.row.setPointerCapture(e.pointerId);
      drag.row.classList.add('dragging');
      document.activeElement?.blur?.();
    }
    drag.dx = dx;
    slide(drag.row, Math.min(0, Math.max(-SWIPE_W * 1.4, drag.base + dx)));
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const { row, base, dx, horiz } = drag;
    drag = null;
    row.classList.remove('dragging');
    if (!horiz) { if (row === swipeOpen && e.type === 'pointerup') closeSwipe(); return; }   // tap on an open row
    if (e.type === 'pointerup' && base + dx < -SWIPE_W / 2) {
      if (swipeOpen !== row) closeSwipe();
      swipeOpen = row;
      row.classList.add('open');
      slide(row, -SWIPE_W);
    } else if (row === swipeOpen) closeSwipe();
    else slide(row, 0);
  };
  main.addEventListener('pointerup', end);
  main.addEventListener('pointercancel', end);
  // A drag that ends over a button or field must not also count as a tap on it.
  main.addEventListener('click', e => {
    const row = e.target.closest('.ex');
    if (row && row.classList.contains('open') && !e.target.closest('.ex-del')) { e.preventDefault(); e.stopPropagation(); }
  }, true);
}

/* =========================================================
   Boot
   ========================================================= */
function init() {
  Store.load();
  $('#btn-hist').innerHTML = ICON.clock;
  $('#btn-export').innerHTML = ICON.dl;
  $('#tabs').innerHTML = TABS.map(([v, label, icon]) => `<button data-act="tab" data-v="${v}">${icon}<span>${label}</span></button>`).join('');

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.closest('#modal-root')) return;
    A[el.dataset.act]?.(el, e);
  });
  const main = $('#main');
  initSwipe(main);
  main.addEventListener('input', e => { if (e.target.matches('.set input')) saveSetInput(e.target); });
  main.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('.set input')) {
      e.preventDefault();
      const all = $$('.set input'), i = all.indexOf(e.target);
      (all[i + 1] || e.target).focus();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1](null); });

  let lastW = window.innerWidth, rt;
  window.addEventListener('resize', () => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(() => { if (view.name === 'history') drawHistoryChart(view.exId); }, 120);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && view.name === 'home') render(); });

  try {
    const v = JSON.parse(sessionStorage.getItem('wt.view'));
    if (v && Views[v.name]) view = v;
  } catch (e) { /* ignore */ }
  if (view.name === 'workout') {
    view.bpIds = (view.bpIds || []).filter(id => Store.bp.has(id));
    if (!view.bpIds.length || !view.date) view = { name: 'home' };
  }
  if (view.name === 'pick' && !view.date) view = { name: 'home' };

  navigator.storage?.persist?.().catch(() => {});
  // Offline support (sw.js sits next to this file); service workers only run over http(s).
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  render();
}
init();
</script>
